<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/DP.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chain Circle</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="ChainCircle - Save Together, Across Any Chain" />
    <meta name="description" content="Decentralized Savings Circle for EVERY user on ANY Blockchain without Bridging, powered by PushChain" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chaincircle.vercel.app/" />
    <meta property="og:title" content="ChainCircle - Save Together, Across Any Chain" />
    <meta property="og:description" content="Decentralized Savings Circle for EVERY user on ANY Blockchain without Bridging, powered by PushChain" />
    <meta property="og:image" content="https://chaincircle.vercel.app/assets/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://chaincircle.vercel.app/" />
    <meta property="twitter:title" content="ChainCircle - Save Together, Across Any Chain" />
    <meta property="twitter:description" content="Decentralized Savings Circle for EVERY user on ANY Blockchain without Bridging, powered by PushChain" />
    <meta property="twitter:image" content="https://chaincircle.vercel.app/assets/preview.png" />

    <script>
      // Initialize theme immediately to prevent flash
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const root = document.documentElement;

        if (theme === 'system') {
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.classList.add(systemTheme);
        } else {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
